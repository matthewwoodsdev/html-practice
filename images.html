<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Images and Display</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    img {
      width: 300px;
      border: 2px solid #2c3e50;
      border-radius: 10px;
    }

    figcaption {
      font-style: italic;
      color: #555;
    }

    .block-demo {
      display: block;
      background-color: #3498db;
      color: white;
      margin: 5px 0;
    }

    .inline-demo {
      display: inline;
      background-color: #e67e22;
      color: white;
    }
  </style>
</head>
<body>

  <h1>Images</h1>

  <figure>
    <img src="https://picsum.photos/300/200" alt="A random photo">
    <figcaption>Figure 1: A random photo from Picsum</figcaption>
  </figure>

  <h2>Block vs Inline</h2>

  <span class="block-demo">I am a block element.</span>
  <span class="block-demo">I take up the full width.</span>

  <p>
    This sentence has
    <span class="inline-demo">inline</span>
    words that stay on the same line.
  </p>

</body>
</html>
